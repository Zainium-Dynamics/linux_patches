# manifest.toml — linux-evl-modules (syshub tier): the modules of the linux-evl kernel
# with the same version, loaded from drivers/modules/<release>.

[package]
name             = "linux-evl-modules"
version          = "7.1.8"
description      = "Linux kernel modules"
license          = "GPL-2.0-only"
maintainer       = "Zainium Dynamics <alizain@zainiumdynamics.tech>"
homepage         = "https://zainiumdynamics.tech"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

depends          = []
provides         = ["linux-evl-modules"]
tags             = ["base", "kernel", "modules"]

[install]
drivers = "/overlayer/syshub/drivers"
_syshub = true

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
