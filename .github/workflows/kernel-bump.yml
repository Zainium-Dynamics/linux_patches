name: kernel bump

# Every Thursday at 10:00 Pakistan time (05:00 UTC), or by hand: when kernel.org
# has a newer Linux and Zainium's patches still apply to it, the kernel recipe is
# bumped on master and the CI workflow is started to build, boot-test and
# publish it. A push made with the workflow's own token starts no workflow by
# itself, so CI is started explicitly.
on:
  schedule:
    - cron: "0 5 * * 4"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: kernel-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Look for a newer Linux and check the patches
        id: bump
        run: sh ci/kernel-bump.sh

      - name: Commit to master and start CI
        if: steps.bump.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
          PACKAGE: ${{ steps.bump.outputs.package }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "$PACKAGE: bump to $VERSION"
          git push origin HEAD:master
          gh workflow run ci.yml --ref master
