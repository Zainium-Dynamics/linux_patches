# manifest.toml — linux-zainium (kernel tier): the kernel image, booted from the ESP.
# Its modules are the syshub package linux-zainium-modules.

[package]
name             = "linux-zainium"
version          = "7.3.1"
description      = "Linux kernel"
license          = "GPL-2.0-only"
maintainer       = "Zainium Dynamics <alizain@zainiumdynamics.tech>"
homepage         = "https://zainiumdynamics.tech"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

depends          = []
provides         = ["linux-zainium", "linux-panic"]
tags             = ["base", "kernel"]
modules          = "linux-zainium-modules"

[install]
kernel  = "/overlayer/zaisys/kernel"
_kernel = true

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
